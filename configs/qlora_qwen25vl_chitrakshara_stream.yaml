# Streaming variant: Chitrakshara-Cap is read straight from the Hugging Face Hub during
# training (no `prepare_data` step, no local copy). Images are downloaded on the fly.
#   python -m indicvlm.train --config configs/qlora_qwen25vl_chitrakshara_stream.yaml


model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
attn_implementation: sdpa          # "flash_attention_2" if flash-attn is installed

# Data: streamed from the Hub
streaming: true
stream:
  dataset: krutrim-ai-labs/chitrakshara
  config: Chitrakshara-Cap          # or Chitrakshara-IL (interleaved documents)
  split: train
  # languages: [Hindi, Tamil]       # default: the 10 Indic languages + English
  max_per_language: 5000            # per dataloader worker; keeps Hindi from dominating
  shuffle_buffer: 10000
  holdout_fraction: 0.01            # 1% of pairs (by content hash) never trained on
  max_eval_samples: 300             # held-out pairs collected once at start for evaluation
  max_caption_chars: 500
  min_image_side: 64
  download_workers: 32
  timeout: 10
max_caption_tokens: 256
min_pixels: 200704                 # 256 * 28 * 28
max_pixels: 401408                 # 512 * 28 * 28 -> <= 512 visual tokens per image

# LoRA (PEFT) on the LLM decoder only; vision tower frozen in bf16
lora_r: 64
lora_alpha: 16
lora_dropout: 0.05

# Optimisation
output_dir: outputs/qwen25vl7b-chitrakshara-qlora
max_steps: 3000                    # required when streaming (no dataset length)
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4     # effective batch 16 per GPU
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 0.3
optim: paged_adamw_8bit
gradient_checkpointing: true
logging_steps: 10
save_steps: 500
eval_steps: 500
save_total_limit: 3
dataloader_num_workers: 2         # each worker runs its own downloads
report_to: none                    # "wandb" / "tensorboard"
seed: 42
