# QLoRA fine-tuning of Qwen2.5-VL-7B-Instruct on Chitrakshara-Cap.
# Sized for a single 24-48 GB GPU (A10G / L4 / A6000 / A100-40G). On 80 GB cards
# raise per_device_train_batch_size and lower gradient_accumulation_steps.

model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
attn_implementation: sdpa          # "flash_attention_2" if flash-attn is installed

# Data (written by `python -m indicvlm.prepare_data`)
train_file: data/chitrakshara_cap/train.jsonl
eval_file: data/chitrakshara_cap/val.jsonl
max_eval_samples: 500
max_caption_tokens: 256
min_pixels: 200704                 # 256 * 28 * 28
max_pixels: 401408                 # 512 * 28 * 28 -> <= 512 visual tokens per image

# LoRA (PEFT) on the LLM decoder only; vision tower frozen in bf16
lora_r: 64
lora_alpha: 16
lora_dropout: 0.05

# Optimisation
output_dir: outputs/qwen25vl7b-chitrakshara-qlora
num_train_epochs: 1
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4     # effective batch 16 per GPU
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 0.3
optim: paged_adamw_8bit
gradient_checkpointing: true
logging_steps: 10
save_steps: 500
eval_steps: 500
save_total_limit: 3
dataloader_num_workers: 4
report_to: none                    # "wandb" / "tensorboard"
seed: 42
